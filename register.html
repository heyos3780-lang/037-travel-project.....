<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="เที่ยวบ้านเรา แนะนำที่เที่ยว อาหาร และแผนเดินทางในจังหวัดประจวบคีรีขันธ์"><title>สมัครสมาชิก | เที่ยวบ้านเรา</title><link rel="stylesheet" href="style.css"></head><body><header><div class="head"><a class="logo" href="index.html">เที่ยว<span>บ้านเรา</span> 🌴</a><nav aria-label="เมนูหลัก"><a href="index.html">หน้าแรก</a><a href="places.html">ที่เที่ยว</a><a href="food.html">อาหาร</a><a href="plan.html">วางแผนเที่ยว</a><a href="travel.html">ข้อมูลการเดินทาง</a><a href="login.html">เข้าสู่ระบบ</a><a href="register.html" aria-current="page">สมัครสมาชิก</a></nav></div></header><main class="wrap"><section class="formbox"><span class="pill">JOIN OUR COMMUNITY</span><h1>สมัครสมาชิก</h1><p class="muted">สร้างบัญชีทดลองเพื่อเข้าสู่เว็บไซต์เที่ยวบ้านเรา</p><form id="register-form"><label class="field" for="reg-username">ชื่อผู้ใช้</label><input id="reg-username" name="username" autocomplete="username" placeholder="อย่างน้อย 3 ตัวอักษร" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" title="ใช้ตัวอักษรภาษาอังกฤษ ตัวเลข และ _ เท่านั้น" required><label class="field" for="reg-email">อีเมล</label><input id="reg-email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required><label class="field" for="reg-password">รหัสผ่าน</label><input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร" minlength="8" required><label class="field" for="reg-confirm">ยืนยันรหัสผ่าน</label><input id="reg-confirm" name="confirm-password" type="password" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="8" required><button class="btn" type="submit">สมัครสมาชิก</button><div id="feedback" class="feedback" role="status" aria-live="polite"></div></form><p class="small-link">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p></footer><script src="auth.js"></script></body></html>
